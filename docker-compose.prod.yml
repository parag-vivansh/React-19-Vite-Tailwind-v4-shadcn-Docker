# Production: small image (~50MB = nginx:alpine + built assets)
# Build: docker compose -f docker-compose.prod.yml build
# Run:   docker compose -f docker-compose.prod.yml up -d
version: "3.9"

services:
  frontend:
    build:
      context: .
      target: production
    ports:
      - "80:80"
    container_name: react-19-tailwind-v4-with-docker-production
